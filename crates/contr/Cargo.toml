[package]
name                   = "contr"
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
async-channel.workspace = true
contr-herdr.workspace = true
contr-usage.workspace = true
gpui.workspace = true
gpui_platform  = { workspace = true, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
serde.workspace = true
serde_json.workspace = true
sysinfo        = { version = "0.31", default-features = false, features = ["system"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[dev-dependencies]
contr-herdr = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

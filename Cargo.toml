[workspace]
members  = ["crates/contr"]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
rust-version = "1.96"
version      = "0.1.0"
publish      = false

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
gpui          = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }

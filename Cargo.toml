[workspace]
members  = ["crates/contr", "crates/contr-herdr", "crates/contr-usage"]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
rust-version = "1.96"
version      = "0.1.0"
publish      = false

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
gpui          = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
async-channel      = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tempfile           = "3"
contr-herdr        = { path = "crates/contr-herdr" }
contr-usage        = { path = "crates/contr-usage" }

[workspace]
members  = ["crates/contr", "crates/contr-herdr"]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
rust-version = "1.96"
version      = "0.1.0"
publish      = false

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
async-channel      = "2"
contr-herdr        = { path = "crates/contr-herdr" }
gpui               = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform      = { package = "gpui-pre-platform", version = "=0.3.9" }
herdr-client       = { git = "https://github.com/penso/herdr-gpui", rev = "1ad3319e12c202e52dc3341e3dc1c9f49a064eb8" }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
